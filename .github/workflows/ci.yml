name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Frontend CI (React + Vite + TypeScript)
  # ─────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint 정적 분석
        run: npm run lint

      - name: TypeScript 타입 체크
        run: npm run typecheck

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────
  # Job 2: Backend CI (Express + TypeScript)
  # ─────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (Express + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript 타입 체크
        run: npm run typecheck

      - name: Run tests (Jest + Supertest)
        run: npm test

      # AC: 커버리지 임계값(전 항목 80%) 미달 시 빌드 실패
      # jest.config.js의 coverageThreshold 설정이 여기서 실제로 적용됨
      - name: Run tests with coverage (threshold 80%)
        run: npm run test:coverage

      - name: Build
        run: npm run build
