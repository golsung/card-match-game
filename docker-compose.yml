services:
  # ─────────────────────────────────────────────────────────
  # Backend: Express API 서버
  # ─────────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────
  # Frontend: React 앱 (nginx로 서빙)
  # /api 요청은 backend 서비스로 프록시
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
